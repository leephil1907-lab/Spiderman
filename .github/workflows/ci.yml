name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: API smoke test
        run: |
          DATA_DIR=/tmp/ci ADMIN_EMAILS=ci-admin@example.com ADMIN_PATH=/hq-ci ADMIN_INITIAL_PASSWORD=ci-pass-123 PORT=3001 node server/index.js &
          sleep 3
          curl -fsS localhost:3001/api/health
          curl -fsS localhost:3001/api/settings > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-bnd: 1' -H 'content-type: application/json' localhost:3001/api/admin/route -d '{"path":"/hq-ci"}')" = "404"
