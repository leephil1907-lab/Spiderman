name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: API smoke test
        run: |
          DATA_DIR=/tmp/ci ADMIN_EMAILS=ci-admin@example.com ADMIN_PATH=/hq-ci ADMIN_INITIAL_PASSWORD=ci-pass-123 PORT=3001 node server/index.js > /tmp/bnd-server.log 2>&1 &
          PID=$!
          sleep 3
          curl -fsS localhost:3001/api/health
          curl -fsS localhost:3001/api/settings > /dev/null
          curl -fsS localhost:3001/robots.txt | grep -q 'Sitemap: http://localhost:3001/sitemap.xml'
          curl -fsS localhost:3001/sitemap.xml | grep -q '<urlset'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'x-bnd: 1' -H 'content-type: application/json' localhost:3001/api/admin/route -d '{"path":"/hq-ci"}')" = "404"
          kill $PID 2>/dev/null || true
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          DATA_DIR=/tmp/e2e ADMIN_EMAILS=ci-admin@example.com ADMIN_PATH=/hq-ci ADMIN_INITIAL_PASSWORD=ci-pass-123 ADMIN_TEST_PASSWORD=ci-pass-123 PORT=3001 npm start > /tmp/bnd-e2e.log 2>&1 &
          sleep 3
          BASE_URL=http://localhost:3001 ADMIN_EMAILS=ci-admin@example.com ADMIN_PATH=/hq-ci ADMIN_INITIAL_PASSWORD=ci-pass-123 ADMIN_TEST_PASSWORD=ci-pass-123 npm run test:e2e || (echo '--- server log ---'; tail -50 /tmp/bnd-e2e.log; exit 1)
