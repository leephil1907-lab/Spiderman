<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Brand New Day</title>
    <meta name="description" content="Brand New Day — the Spider-Man film destination with trailers, cast, film media, where to watch and a dedicated Fan Club." />
    <meta name="application-name" content="Brand New Day" />
    <meta name="theme-color" content="#150406" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Browser + app identity -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Brand New Day" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brand New Day" />
    <meta property="og:title" content="Brand New Day" />
    <meta property="og:description" content="Explore Brand New Day — Spider-Man film media, trailer, cast, where to watch and the dedicated Fan Club." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="https://i.ytimg.com/vi/P3uI5sLosKU/maxresdefault.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Spider-Man: Brand New Day — Final Trailer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brand New Day" />
    <meta name="twitter:description" content="Explore Brand New Day — Spider-Man film media, trailer, cast, where to watch and the dedicated Fan Club." />
    <meta name="twitter:image" content="https://i.ytimg.com/vi/P3uI5sLosKU/maxresdefault.jpg" />
    <meta name="twitter:image:alt" content="Spider-Man: Brand New Day — Final Trailer" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "name": "Brand New Day",
            "url": "%VITE_SITE_URL%/",
            "inLanguage": "en"
          },
          {
            "@type": "Movie",
            "name": "Brand New Day",
            "datePublished": "2026-07-31",
            "director": { "@type": "Person", "name": "Destin Daniel Cretton" },
            "musicBy": { "@type": "Person", "name": "Michael Giacchino" },
            "duration": "PT2H25M",
            "contentRating": "PG-13",
            "productionCompany": [
              { "@type": "Organization", "name": "Marvel Studios" },
              { "@type": "Organization", "name": "Columbia Pictures" }
            ],
            "actor": [
              { "@type": "Person", "name": "Tom Holland" },
              { "@type": "Person", "name": "Zendaya" },
              { "@type": "Person", "name": "Jacob Batalon" },
              { "@type": "Person", "name": "Jon Bernthal" },
              { "@type": "Person", "name": "Mark Ruffalo" }
            ],
            "image": "https://i.ytimg.com/vi/P3uI5sLosKU/maxresdefault.jpg"
          }
        ]
      }
    </script>
    <!-- Boot splash: painted before any JS downloads; React replaces #root's content on first render -->
    <style>
      html,body{background:#150406;margin:0}
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(70% 55% at 50% 42%,#2a0a0e,#150406 70%);z-index:1}
      #boot .b-in{display:grid;justify-items:center;gap:18px;animation:b-fade .5s ease both}
      #boot img{width:64px;height:64px;border-radius:16px;box-shadow:0 0 0 0 rgba(224,32,43,.5);animation:b-pulse 1.6s ease-out infinite}
      #boot .b-t{font:800 12px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.32em;color:#9a8a8d}
      #boot .b-bar{width:140px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
      #boot .b-bar i{display:block;width:40%;height:100%;background:#e0202b;box-shadow:0 0 10px #e0202b;animation:b-run 1.1s cubic-bezier(.6,0,.4,1) infinite}
      @keyframes b-pulse{70%{box-shadow:0 0 0 18px rgba(224,32,43,0)}100%{box-shadow:0 0 0 0 rgba(224,32,43,0)}}
      @keyframes b-run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @keyframes b-fade{from{opacity:0;transform:translateY(6px)}}
      @media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding:40px;font-family:system-ui;color:#f2f3f5;background:#150406">
        Brand New Day. Please enable JavaScript to explore the film and access the Fan Club.
      </div>
    </noscript>
    <div id="root"><div id="boot" role="status" aria-label="Loading Brand New Day"><div class="b-in"><img src="/favicon.svg" alt="" width="64" height="64" /><span class="b-t">BRAND NEW DAY</span><span class="b-bar"><i></i></span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
